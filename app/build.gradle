plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'guide.tailor'
    compileSdk 34

    // Web assets must be stored uncompressed so file:///android_asset/ can stream them
    aaptOptions {
        noCompress 'js', 'css', 'html', 'json', 'svg', 'ttf', 'woff', 'woff2', 'eot'
    }

    defaultConfig {
        applicationId "guide.tailor"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Raise javac error cap (default 100) so we see the true error count
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xmaxerrs', '2000']
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'

    // GMS Vision barcode (BarCodeCaptureActivity + barcode/ overlay classes)
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    // Camera2 + support used by capture/calibration flow
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // --- M3 recovered feature dependencies (from APK smali/decompiled imports) ---
    // Lottie animation (C2267m result screen)
    implementation 'com.airbnb.android:lottie:3.4.4'
    // Material design (CoordinatorLayout, TabLayout, Snackbar, FAB)
    implementation 'com.google.android.material:material:1.12.0'
    // ConstraintLayout used by activity_angle_calibration.xml
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // ViewPager / media-session compat used by ported classes
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    // Google Sign-In (legacy Auth API as used by the original)
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    // Facebook Login/Share (login(provider) command + C2251a/C2252b helpers)
    implementation 'com.facebook.android:facebook-login:15.0.2'
    implementation 'com.facebook.android:facebook-share:15.0.2'
    // Firebase (BOM keeps versions aligned); auth + messaging + analytics
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    // Legacy FirebaseInstanceId API (used by MyFirebaseInstanceIDService in the original APK).
    implementation 'com.google.firebase:firebase-iid:21.1.0'
}
